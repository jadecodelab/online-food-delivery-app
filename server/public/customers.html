<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customers - Online Food Delivery</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/">🍜 Online Food Delivery</a>
      <nav class="nav" aria-label="Main">
        <a href="/">Home</a>
        <a href="/menu.html">Menu</a>
        <a href="/orders.html">Orders</a>
        <a href="/customers.html">Customers</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="page-head">
      <div>
        <h1>Customers</h1>
        <p class="subtitle">Search customers by name, email, or phone number.</p>
      </div>
      <button type="button" class="btn btn-primary" id="add-btn">+ Add customer</button>
    </div>

    <!-- Add customer form (hidden until "+ Add customer" is clicked) -->
    <form id="customer-form" class="card form-card" novalidate hidden>
      <h2 id="form-title">Add customer</h2>
      <p class="hint">Fields marked <span class="req">*</span> are required.</p>
      <div id="form-message" class="message" role="alert"></div>

      <div class="form-grid">
        <div class="field">
          <label for="firstName">First name <span class="req">*</span></label>
          <input id="firstName" name="firstName" type="text" maxlength="50" autocomplete="given-name" required>
          <span class="field-error" id="err-firstName"></span>
        </div>
        <div class="field">
          <label for="lastName">Last name <span class="req">*</span></label>
          <input id="lastName" name="lastName" type="text" maxlength="50" autocomplete="family-name" required>
          <span class="field-error" id="err-lastName"></span>
        </div>
        <div class="field">
          <label for="email">Email <span class="req">*</span></label>
          <input id="email" name="email" type="email" maxlength="100" autocomplete="email" placeholder="name@example.com" required>
          <span class="field-error" id="err-email"></span>
        </div>
        <div class="field">
          <label for="phoneNumber">Phone number <span class="req">*</span></label>
          <input id="phoneNumber" name="phoneNumber" type="tel" maxlength="20" autocomplete="tel" placeholder="217-555-0199" required>
          <span class="field-error" id="err-phoneNumber"></span>
        </div>
        <div class="field full">
          <label for="address">Address <span class="req">*</span></label>
          <input id="address" name="address" type="text" maxlength="200" autocomplete="street-address" placeholder="Street, City, State ZIP" required>
          <span class="field-error" id="err-address"></span>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary" id="save-btn">Save customer</button>
        <button type="button" class="btn btn-secondary" id="cancel-btn">Cancel</button>
      </div>
    </form>

    <form id="search-form" class="card" novalidate>
      <div class="field">
        <label for="search">Name, email, or phone</label>
        <input id="search" name="search" type="text" maxlength="100" placeholder="e.g. Lee, example.com, 555-0105">
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary" id="search-btn">Search</button>
        <button type="button" class="btn btn-secondary" id="reset-btn">Show all</button>
      </div>
    </form>

    <div id="message" class="message" role="status" aria-live="polite"></div>

    <p id="summary" class="result-summary"></p>
    <div class="table-wrap">
      <table class="data" id="results" hidden>
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Address</th>
            <th class="num">Orders</th>
            <th><span class="visually-hidden">Actions</span></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <script src="/main.js"></script>
  <script src="/customers.js"></script>
</body>
</html>
